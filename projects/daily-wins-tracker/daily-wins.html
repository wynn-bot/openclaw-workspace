<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daily Wins Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e27;
            --bg-card: #1a1f3a;
            --bg-input: #0f1429;
            --border: #2d3561;
            --text-primary: #ffffff;
            --text-secondary: #888;
            --accent: #00d4ff;
            --success: #00ff00;
            --warning: #ffaa00;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            padding-bottom: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* STATS CARD */
        .stats-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-box {
            background: var(--bg-input);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* QUICK INPUT */
        .quick-input-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .quick-input-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .categories {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .category-btn {
            padding: 12px;
            border: 2px solid var(--border);
            background: var(--bg-input);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-btn:active {
            transform: scale(0.95);
        }

        .category-btn.selected {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--bg-dark);
        }

        .win-input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        textarea {
            min-height: 60px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent) 0%, #0099cc 100%);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* TODAY'S WINS */
        .wins-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .wins-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .wins-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .win-item {
            background: var(--bg-input);
            border-left: 4px solid var(--success);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .win-item-content {
            flex: 1;
        }

        .win-item-title {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .win-item-category {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .win-item-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* HEATMAP */
        .heatmap-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .heatmap-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .heatmap {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .heatmap-cell {
            aspect-ratio: 1;
            border-radius: 4px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .heatmap-cell:hover {
            transform: scale(1.1);
        }

        .heatmap-cell.level-0 {
            background: var(--bg-input);
            color: var(--text-secondary);
        }

        .heatmap-cell.level-1 {
            background: rgba(0, 255, 0, 0.2);
            color: var(--success);
        }

        .heatmap-cell.level-2 {
            background: rgba(0, 255, 0, 0.4);
            color: var(--success);
        }

        .heatmap-cell.level-3 {
            background: rgba(0, 255, 0, 0.6);
            color: var(--success);
        }

        .heatmap-cell.level-4 {
            background: var(--success);
            color: var(--bg-dark);
        }

        /* CONFETTI */
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .categories {
                grid-template-columns: 1fr 1fr;
            }

            .stat-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Daily Wins</h1>
            <p class="subtitle">Track small wins. Build big momentum.</p>
        </header>

        <!-- STATS -->
        <div class="stats-card">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="todayWins">0</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="streakDays">0</div>
                    <div class="stat-label">Day Streak</div>
                </div>
            </div>
        </div>

        <!-- QUICK INPUT -->
        <div class="quick-input-section">
            <h2>Add a Win</h2>
            <div class="categories" id="categories"></div>
            <div class="win-input-group">
                <label>What did you accomplish?</label>
                <input type="text" id="winTitle" placeholder="e.g., 50 pushups, read 30 min, cold shower..." maxlength="60">
            </div>
            <div class="win-input-group">
                <label>Details (optional)</label>
                <textarea id="winDetails" placeholder="Any notes..."></textarea>
            </div>
            <button class="btn-primary" id="submitBtn">Log This Win ✨</button>
        </div>

        <!-- TODAY'S WINS -->
        <div class="wins-section">
            <h2>Today's Wins</h2>
            <div class="wins-list" id="winsList">
                <div class="empty-state">No wins logged yet. Start now! 🚀</div>
            </div>
        </div>

        <!-- HEATMAP -->
        <div class="heatmap-section">
            <h2>12-Week Momentum</h2>
            <div class="heatmap" id="heatmap"></div>
        </div>
    </div>

    <script>
        // CATEGORIES
        const CATEGORIES = [
            { id: 'fitness', label: '💪 Fitness', color: '#ff6b6b' },
            { id: 'learning', label: '📚 Learning', color: '#4ecdc4' },
            { id: 'social', label: '👥 Social', color: '#ffe66d' },
            { id: 'work', label: '💼 Work', color: '#a8d8ea' },
            { id: 'health', label: '❤️ Health', color: '#ff8fab' },
            { id: 'discipline', label: '🎯 Discipline', color: '#95e1d3' }
        ];

        // STATE
        let state = {
            selectedCategory: 'fitness',
            wins: [],
            heatmapData: {}
        };

        // DOM
        const elements = {
            categories: document.getElementById('categories'),
            winTitle: document.getElementById('winTitle'),
            winDetails: document.getElementById('winDetails'),
            submitBtn: document.getElementById('submitBtn'),
            winsList: document.getElementById('winsList'),
            heatmap: document.getElementById('heatmap'),
            todayWins: document.getElementById('todayWins'),
            streakDays: document.getElementById('streakDays')
        };

        // INIT
        function init() {
            loadData();
            renderCategories();
            renderHeatmap();
            updateStats();
            submitBtn.addEventListener('click', addWin);
            winTitle.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addWin();
            });
        }

        // CATEGORY BUTTONS
        function renderCategories() {
            elements.categories.innerHTML = CATEGORIES.map(cat => `
                <button class="category-btn ${state.selectedCategory === cat.id ? 'selected' : ''}" 
                        data-category="${cat.id}">
                    ${cat.label}
                </button>
            `).join('');

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    state.selectedCategory = btn.dataset.category;
                });
            });
        }

        // ADD WIN
        function addWin() {
            const title = elements.winTitle.value.trim();
            const details = elements.winDetails.value.trim();
            const category = state.selectedCategory;

            if (!title) {
                alert('Please enter a win!');
                return;
            }

            const win = {
                id: Date.now(),
                title,
                details,
                category,
                timestamp: new Date().toISOString()
            };

            state.wins.push(win);
            saveData();

            // CELEBRATION
            playSound('win');
            confetti();

            // RESET
            elements.winTitle.value = '';
            elements.winDetails.value = '';

            updateStats();
            renderWins();
            renderHeatmap();
        }

        // RENDER WINS
        function renderWins() {
            const today = new Date().toDateString();
            const todayWins = state.wins.filter(w => new Date(w.timestamp).toDateString() === today);

            if (todayWins.length === 0) {
                elements.winsList.innerHTML = '<div class="empty-state">No wins logged yet. Start now! 🚀</div>';
                return;
            }

            elements.winsList.innerHTML = todayWins.map(win => {
                const cat = CATEGORIES.find(c => c.id === win.category);
                return `
                    <div class="win-item">
                        <div class="win-item-content">
                            <div class="win-item-title">${win.title}</div>
                            <div class="win-item-category">${cat.label}</div>
                        </div>
                        <button class="win-item-delete" onclick="deleteWin(${win.id})">Delete</button>
                    </div>
                `;
            }).join('');
        }

        // DELETE WIN
        function deleteWin(id) {
            state.wins = state.wins.filter(w => w.id !== id);
            saveData();
            updateStats();
            renderWins();
            renderHeatmap();
        }

        // HEATMAP
        function renderHeatmap() {
            const today = new Date();
            const startDate = new Date(today);
            startDate.setDate(startDate.getDate() - 84); // 12 weeks back

            let html = '';
            for (let i = 0; i < 84; i++) {
                const date = new Date(startDate);
                date.setDate(date.getDate() + i);
                const dateStr = date.toDateString();
                const winCount = state.wins.filter(w => new Date(w.timestamp).toDateString() === dateStr).length;
                const level = Math.min(winCount, 4);

                html += `<div class="heatmap-cell level-${level}" title="${dateStr}: ${winCount} wins">${winCount || ''}</div>`;
            }
            elements.heatmap.innerHTML = html;
        }

        // UPDATE STATS
        function updateStats() {
            const today = new Date().toDateString();
            const todayWins = state.wins.filter(w => new Date(w.timestamp).toDateString() === today).length;
            elements.todayWins.textContent = todayWins;

            // STREAK
            let streak = 0;
            let checkDate = new Date();
            while (true) {
                const dateStr = checkDate.toDateString();
                const dayWins = state.wins.filter(w => new Date(w.timestamp).toDateString() === dateStr).length;
                if (dayWins === 0) break;
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            }
            elements.streakDays.textContent = streak;
        }

        // SOUND
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'win') {
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            }
        }

        // CONFETTI
        function confetti() {
            for (let i = 0; i < 30; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.textContent = ['🎉', '✨', '🚀', '⭐', '💪'][Math.floor(Math.random() * 5)];
                el.style.left = Math.random() * 100 + '%';
                el.style.top = '-10px';
                el.style.fontSize = (20 + Math.random() * 10) + 'px';
                el.style.animation = `fall ${2 + Math.random()}s linear forwards`;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 2500);
            }
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    transform: translateY(100vh) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // STORAGE
        function saveData() {
            localStorage.setItem('dailyWinsData', JSON.stringify(state.wins));
        }

        function loadData() {
            const saved = localStorage.getItem('dailyWinsData');
            if (saved) {
                state.wins = JSON.parse(saved);
            }
            renderWins();
        }

        // START
        init();
    </script>
</body>
</html>
